<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#103e24"/><title>寰宇行動大學｜模擬預覽</title>
<style>
:root{--ink:#1d2a22;--muted:#5d6b62;--accent:#0c603c;--border:#e2dfd2;--bg:#f8f6ef;--teal:#486c48}*{box-sizing:border-box}html,body{padding:0;margin:0;font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;color:var(--ink)}body{background:var(--bg)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}a{color:inherit;text-decoration:none}.banner{background:#fff2d9;color:#855c25;text-align:center;padding:10px 14px;font-size:12px;border-bottom:1px solid #eddaa9}.header{height:72px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1120px)/2));border-bottom:1px solid var(--border);gap:16px}.brand{font-size:18px;font-weight:850;white-space:nowrap;display:flex;align-items:center;gap:12px}.brandmark{height:37px;width:37px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(130deg,#14502e,#279e5b);color:#fff;letter-spacing:-2px}.nav{display:flex;align-items:center;gap:24px;font-size:14px}.nav a:hover{color:var(--accent)}.login{background:#e7f1ea;border:1px solid #cbf0db;padding:9px 15px;border-radius:9px;color:#248c51;font-weight:700}.wrap{max-width:1120px;padding:32px 20px 70px;margin:auto}.hero{background:radial-gradient(circle at 85% 20%,#28814f 0,transparent 36%),linear-gradient(105deg,#144027,#21663f);color:white;border-radius:22px;min-height:245px;padding:45px 48px;position:relative;overflow:hidden}.hero:after{content:'✧';font-size:180px;position:absolute;right:80px;top:5px;color:#ffffff10}.eyebrow{font-size:12px;color:#8ad0a8;letter-spacing:2px;font-weight:750}.hero h1{font-size:36px;line-height:1.45;margin:14px 0 10px;letter-spacing:1px}.hero p{margin:0;font-size:14px;color:#d2edde}.hero-stats{display:flex;gap:28px;margin-top:26px;color:#c3e8d3;font-size:12px}.hero-stats strong{color:white;font-size:18px;margin-right:6px}.section-head{display:flex;align-items:end;justify-content:space-between;margin:35px 0 20px;gap:15px}.section-head h2{font-size:24px;margin:0}.section-head p{font-size:13px;color:var(--muted);margin:6px 0 0}.search{width:min(340px,100%);height:43px;padding:0 14px;border:1px solid var(--border);background:#fff;border-radius:10px;outline:none}.search:focus{border-color:var(--accent)}.chips{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:21px}.chip{border-radius:99px;padding:9px 15px;border:1px solid var(--border);background:white;color:#547864;font-size:13px}.chip.active{background:var(--ink);color:white;border-color:var(--ink)}.courses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:19px}.course{background:#fff;border:1px solid var(--border);border-radius:15px;overflow:hidden;cursor:pointer;text-align:left;padding:0;transition:transform .15s,box-shadow .15s}.course:hover{transform:translateY(-3px);box-shadow:0 13px 22px #204d3414}.cover{height:158px;display:flex;align-items:center;justify-content:center;color:#fff;position:relative;background:linear-gradient(145deg,#247b4a,#114427)}.cover.c2{background:linear-gradient(135deg,#1c7241,#15522f)}.cover.c3{background:linear-gradient(135deg,#57886c,#144429)}.cover.c4{background:linear-gradient(135deg,#795a57,#2c5a40)}.playicon{display:grid;place-items:center;height:48px;width:48px;border-radius:50%;background:#ffffff30;border:1px solid #ffffff55;font-size:20px;padding-left:3px}.sourcepill{position:absolute;right:12px;top:12px;font-size:13px;background:#0007;border-radius:5px;padding:5px 8px}.coverlabel{position:absolute;bottom:14px;left:16px;color:#d9f5e5;font-size:12px}.coursebody{padding:19px 18px 20px}.coursebody h3{font-size:17px;margin:0 0 10px;line-height:1.5}.coursebody p{font-size:13px;color:var(--muted);line-height:1.65;margin:0 0 16px;min-height:43px}.pills{display:flex;gap:8px}.pill{font-size:13px;padding:5px 8px;background:#e7f1ea;border-radius:6px;color:#358f5c}.empty{background:white;border-radius:14px;padding:38px;text-align:center;color:var(--muted)}.footer{padding:30px;text-align:center;color:#93ae9f;font-size:12px}.back{border:0;background:transparent;color:var(--accent);font-weight:700;padding:0;margin:10px 0 22px}.detailbox{max-width:920px;margin:auto}.player{height:400px;border-radius:17px;background:linear-gradient(135deg,#143a24,#1a663b);display:grid;place-items:center;color:white;text-align:center}.player .playicon{margin:auto auto 15px}.player p{font-size:13px;color:#c5e3d2}.detailtitle{font-size:30px;margin:25px 0 12px}.detaildesc{font-size:15px;color:#71927f;line-height:1.8}.between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}.primary{background:var(--accent);border:0;color:#fff;font-weight:700;border-radius:9px;padding:11px 17px}.secondary{background:#fff;border:1px solid #bee3ce;color:var(--accent);font-weight:700;border-radius:9px;padding:11px 17px}.panel{background:#fff;border:1px solid var(--border);padding:24px;border-radius:13px;margin-top:25px}.panel h3{margin-top:0}.comment{border-top:1px solid var(--border);padding:15px 0}.comment.child{margin-left:36px;border-left:2px solid #dff2e7;padding-left:14px}.comment-meta{font-size:13px;color:#94aa9e;margin-bottom:8px}.comment-body{font-size:14px;line-height:1.6}.mini{border:0;background:transparent;color:var(--accent);padding:9px 12px 0 0;font-size:12px}.compose{display:grid;gap:12px;margin-top:15px}textarea,.field,select{background:#fff;border:1px solid #d8ede1;border-radius:9px;padding:12px;min-height:43px;width:100%}textarea{min-height:90px;resize:vertical}.compose .primary{justify-self:start}.error{color:#b33e36}.gray{color:var(--muted)}.panel label{font-size:13px;font-weight:700;display:block;margin:15px 0 7px}.panel .hint{font-size:12px;color:var(--muted)}.steps{background:#e7f1ea;padding:20px;border-radius:13px}.role{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px}.role button{padding:11px 13px;border-radius:9px;background:#fff;border:1px solid var(--border);color:var(--ink)}.role button.active{background:#e7f1ea;border-color:var(--accent)}.switchrow{display:flex;align-items:center;gap:10px;font-size:13px}.hidden{display:none}.toast{position:fixed;bottom:25px;right:25px;padding:12px 18px;border-radius:10px;background:#185432;color:#fff;box-shadow:0 8px 18px #163d2733;display:none;z-index:4}
@media(max-width:850px){.courses{grid-template-columns:repeat(2,1fr)}.hero{padding:36px}.hero h1{font-size:30px}.nav{gap:10px}.player{height:300px}}
@media(max-width:570px){.courses{grid-template-columns:1fr}.header{height:64px;padding:0 14px}.brand{font-size:15px}.brandmark{width:32px;height:32px}.nav{font-size:12px;gap:10px}.nav .hide-sm{display:none}.login{padding:8px}.wrap{padding:18px 14px 35px}.hero{padding:30px 22px;border-radius:15px;min-height:205px}.hero h1{font-size:24px}.section-head{align-items:start;flex-direction:column}.search{width:100%}.cover{height:185px}.player{height:245px}.detailtitle{font-size:23px}.panel{padding:17px}}
.comment-count{margin:8px 0 14px;color:var(--ink);font-weight:600}.replybar{font-weight:650;display:flex;align-items:center;gap:12px}.manage-row{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:15px 0;border-bottom:1px solid var(--border)}.row-actions{display:flex;gap:8px;flex-wrap:wrap}.manage-row .pills{margin-top:8px}.risk-row{padding:10px 0;color:#96531e}.risk-row label{font-size:14px}.panel>h3{font-size:20px}.panel .empty{padding:18px}.player{min-height:245px}@media(max-width:570px){.manage-row{align-items:flex-start;flex-direction:column}}
</style></head><body>

<header class="header"><a class="brand" href="/" data-route="/"><span class="brandmark">學</span><span>寰宇行動大學</span></a><nav class="nav"><a href="/" data-route="/">探索課程</a><a href="/admin" data-route="/admin" class="hide-sm">管理影片</a><a href="/settings" data-route="/settings" class="hide-sm">我的學習</a><button class="login" id="userBtn" onclick="go('/settings')">訪客模式</button></nav></header>
<main class="wrap" id="view" aria-live="polite"></main><div id="toast" class="toast"></div>
<script>
const initial=[
{id:'nutrition101',title:'營養概論｜建立健康的基礎',description:'從每天的飲食開始，理解均衡營養的重要觀念。',category:'營養健康',access:'public',source:'Mux',color:1},
{id:'learnhabit',title:'高效率學習與行動養成',description:'把知識變成習慣，打造可持續的學習節奏。',category:'個人成長',access:'members',source:'YouTube',color:2},
{id:'leadership',title:'領導力進階培訓',description:'以真實情境練習團隊溝通、規劃與執行。',category:'事業培訓',access:'rank',source:'Mux',color:3},
{id:'practicelife',title:'生活中的健康管理',description:'將健康管理實踐在每天的生活安排。',category:'營養健康',access:'public',source:'YouTube',color:4}];
let videos=[...initial],drafts=[],identity='guest',owner=false,category='全部',search='',comments=[],replyId=null,editId=null;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const can=v=>v.access==='public'||(v.access==='members'&&identity!=='guest')||(v.access==='rank'&&identity==='verified');
const accessName=v=>({public:'公開影片',members:'登入會員',rank:'獎銜限定'}[v]);
function go(path){if(location.protocol==='file:')location.hash=path;else history.pushState({},'',path);replyId=null;editId=null;render();window.scrollTo(0,0)}
window.addEventListener('popstate',()=>render());window.addEventListener('hashchange',()=>render());document.addEventListener('click',e=>{const a=e.target.closest('[data-route]');if(a){e.preventDefault();go(a.getAttribute('data-route'))}});
function showToast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>t.style.display='none',2900)}
function render(){let path=location.protocol==='file:'?(location.hash.slice(1)||'/'):decodeURIComponent(location.pathname);$('#userBtn').textContent=identity==='guest'?'訪客模式':identity==='member'?'會員模式':'資格會員模式';
 if(path==='/')home();else if(path==='/settings')settings();else if(path==='/admin')admin();else detail(path.slice(1));}
function home(){const list=videos.filter(v=>can(v)&&(!search||(v.title+v.description).includes(search))&&(category==='全部'||v.category===category));
 $('#view').innerHTML=`<section class="hero"><h1>持續學習，開啟更多可能</h1></section>
 <div class="section-head"><div><h2>探索精選課程</h2></div><input class="search" id="search" placeholder="搜尋影片名稱或介紹" value="${esc(search)}" aria-label="搜尋"/></div>
 <div class="chips">${['全部','營養健康','個人成長','事業培訓'].map(c=>`<button class="chip ${category===c?'active':''}" data-filter="${c}">${c}</button>`).join('')}</div>
 <div class="courses">${list.map(v=>`<button class="course" data-open="${esc(v.id)}"><div class="cover c${v.color}"><span class="playicon">▶</span></div><div class="coursebody"><h3>${esc(v.title)}</h3><div class="pills"><span class="pill">${accessName(v.access)}</span></div></div></button>`).join('')}</div>${list.length?'':'<div class="empty">目前沒有符合條件的課程</div>'}`;
 $('#search').addEventListener('input',e=>{search=e.target.value;let pos=e.target.selectionStart;home();$('#search').focus();$('#search').setSelectionRange(pos,pos)});
 document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{category=b.dataset.filter;home()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>go('/'+b.dataset.open));
}
function detail(id){const v=videos.find(x=>x.id===id);if(!v||!can(v)){ $('#view').innerHTML=`<div class="detailbox"><button class="back" onclick="go('/')">← 返回課程列表</button><div class="empty"><h2>需要符合資格才能瀏覽此內容</h2><button class="primary" onclick="go('/settings')">查看身份設定</button></div></div>`;return}
 const cs=comments.filter(c=>c.videoId===id);
 $('#view').innerHTML=`<div class="detailbox"><button class="back" onclick="go('/')">← 返回課程列表</button><div class="player"><div><span class="playicon">▶</span><div style="font-weight:700">${esc(v.source)} 播放區</div></div></div><div class="between"><div><h1 class="detailtitle">${esc(v.title)}</h1><div class="pills"><span class="pill">${accessName(v.access)}</span><span class="pill">${esc(v.category)}</span></div></div><button class="secondary" onclick="share('${esc(v.id)}')">分享影片</button></div><p class="detaildesc">${esc(v.description)}</p>
 <div class="panel"><h3>學習心得與討論</h3><div class="comment-count">${cs.length} 則留言</div>
 ${cs.map(c=>`<div class="comment ${c.parent?'child':''}"><div class="comment-meta">${c.author===identity?'我的留言':'會員'} · ${new Date(c.date).toLocaleDateString('zh-TW')}</div>${editId===c.id?`<textarea id="editText" maxlength="2000">${esc(c.body)}</textarea><button class="primary" id="saveEdit">儲存</button><button class="mini" id="cancelEdit">取消</button>`:`<div class="comment-body">${esc(c.body)}</div>`}${identity!=='guest'&&!c.parent?`<button class="mini" data-reply="${c.id}">回覆</button>`:''}${identity!=='guest'&&c.author!==identity?`<button class="mini" data-report="${c.id}">檢舉</button>`:''}${c.author===identity?`<button class="mini" data-edit="${c.id}">編輯</button><button class="mini" data-delete="${c.id}">刪除</button>`:''}</div>`).join('')}
 ${identity==='guest'?'<p class="gray">登入後即可發表心得。</p>':`<div class="compose">${replyId?'<div class="replybar">回覆留言 <button class="mini" id="cancelReply">取消</button></div>':''}<textarea id="commentText" placeholder="分享你今天學到的觀念……"></textarea><button class="primary" id="submitComment">發表留言</button></div>`}</div></div>`;
 document.querySelectorAll('[data-reply]').forEach(x=>x.onclick=()=>{if(identity==='guest'){go('/settings');return}replyId=x.dataset.reply;detail(id)});if($('#cancelReply'))$('#cancelReply').onclick=()=>{replyId=null;detail(id)};
 document.querySelectorAll('[data-report]').forEach(x=>x.onclick=()=>showToast('已檢舉'));
 document.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>{editId=x.dataset.edit;detail(id)});
 const saveEdit=$('#saveEdit');if(saveEdit)saveEdit.onclick=()=>{const item=comments.find(c=>c.id===editId&&c.author===identity);const body=$('#editText').value.trim();if(item&&body){item.body=body;editId=null;detail(id);showToast('留言已更新')}};
 const cancelEdit=$('#cancelEdit');if(cancelEdit)cancelEdit.onclick=()=>{editId=null;detail(id)};
 document.querySelectorAll('[data-delete]').forEach(x=>x.onclick=()=>{const target=comments.find(c=>c.id===x.dataset.delete);if(target?.author!==identity)return;comments=comments.filter(c=>c.id!==x.dataset.delete&&c.parent!==x.dataset.delete);detail(id)});
 const submit=$('#submitComment');if(submit)submit.onclick=()=>{const text=$('#commentText').value.trim();if(!text)return;comments.push({id:Math.random().toString(36).slice(2),videoId:id,author:identity,body:text,parent:replyId,date:new Date().toISOString()});replyId=null;detail(id);showToast('留言已發表')};
}
async function share(id){const url='https://learn.hglobal1985.com/'+id;try{if(navigator.share)await navigator.share({url,title:'寰宇行動大學'});else if(navigator.clipboard){await navigator.clipboard.writeText(url);showToast('已複製分享網址：'+url)}else showToast(url)}catch(e){if(e.name!=='AbortError')showToast(url)}}
function settings(){$('#view').innerHTML=`<div class="detailbox"><h1>我的學習</h1><div class="panel"><h3>模擬會員資格</h3><div class="role">${[{id:'guest',label:'訪客'},{id:'member',label:'登入會員（模擬）'},{id:'verified',label:'符合獎銜資格（模擬）'}].map(m=>`<button class="${identity===m.id?'active':''}" data-identity="${m.id}">${m.label}</button>`).join('')}</div><label class="switchrow"><input type="checkbox" id="owner" ${owner?'checked':''} style="width:auto;min-height:auto"/> 模擬擁有者管理後台（與獎銜獨立）</label></div></div>`;
 document.querySelectorAll('[data-identity]').forEach(b=>b.onclick=()=>{identity=b.dataset.identity;settings()});$('#owner').onchange=e=>owner=e.target.checked;
}
function validYouTubeUrl(raw){
 try{const u=new URL(raw);const h=u.hostname.toLowerCase().replace(/^www\./,'');if(h==='youtu.be')return /^[\w-]{11}$/.test(u.pathname.slice(1));if(h==='youtube.com'||h==='m.youtube.com'||h==='music.youtube.com'){const id=u.pathname.startsWith('/shorts/')||u.pathname.startsWith('/embed/')?u.pathname.split('/')[2]:u.searchParams.get('v');return /^[\w-]{11}$/.test(id||'')}return false}catch{return false}
}
function publishDraft(id){const d=drafts.find(x=>x.id===id);if(!d)return;
 if(d.source==='Mux'){showToast('尚未完成 Mux 上傳，無法發布');return}
 if(!validYouTubeUrl(d.youtubeUrl||'')){showToast('請先設定有效的 YouTube 網址');return}
 if(d.youtubeVisibility==='unlisted'&&d.access!=='public'&&!d.acceptRisk){showToast('必須確認 YouTube 不公開影片的來源網址可被轉傳');return}
 drafts=drafts.filter(x=>x.id!==id);videos.unshift({...d});showToast('已發布');admin();
}
function unpublishVideo(id){const v=videos.find(x=>x.id===id);if(!v||initial.includes(v))return;videos=videos.filter(x=>x.id!==id);drafts.unshift({...v});showToast('已下架');admin()}
function deleteDraft(id){drafts=drafts.filter(x=>x.id!==id);admin()}
function admin(){if(!owner){$('#view').innerHTML=`<div class="detailbox"><h1>管理影片</h1><div class="empty"><h3>沒有管理員權限</h3><button class="primary" onclick="go('/settings')">前往身份設定</button></div></div>`;return}
 $('#view').innerHTML=`<div class="detailbox"><h1>影片管理</h1><div class="panel"><h3>新增影片</h3>
 <label for="title">影片標題</label><input class="field" id="title" maxlength="120" placeholder="影片標題"/>
 <label for="desc">影片介紹</label><textarea id="desc" maxlength="3000" placeholder="影片介紹"></textarea>
 <label for="category">分類</label><input class="field" id="category" value="一般"/>
 <label for="source">影片來源</label><select id="source"><option value="youtube">YouTube 連結</option><option value="mux">Mux 串流</option></select>
 <div id="sourcefields"></div><label for="mode">觀看權限</label><select id="mode"><option value="rank">獎銜限定</option><option value="members">登入會員</option><option value="public">公開</option></select>
 <div id="rankfield"><label>最低獎銜</label><select disabled class="field"><option>請先串接中央會員</option></select></div>
 <button id="save" class="primary" style="margin-top:18px">儲存草稿</button></div>
 <div class="panel"><h3>草稿（${drafts.length}）</h3>${drafts.length?drafts.map(v=>`<div class="manage-row"><div><strong>${esc(v.title)}</strong><div class="pills"><span class="pill">${accessName(v.access)}</span><span class="pill">${esc(v.source)}</span></div></div><div class="row-actions"><button class="primary" data-publish="${esc(v.id)}">發布</button><button class="secondary" data-draft-delete="${esc(v.id)}">刪除</button></div></div>`).join(''):'<div class="empty">目前沒有草稿</div>'}</div>
 <div class="panel"><h3>已發布（${videos.length}）</h3>${videos.map(v=>`<div class="manage-row"><div><strong>${esc(v.title)}</strong><div class="pills"><span class="pill">${accessName(v.access)}</span><span class="pill">${esc(v.source)}</span></div></div><div class="row-actions"><button class="secondary" data-admin-view="${esc(v.id)}">查看</button>${initial.includes(v)?'':`<button class="secondary" data-unpublish="${esc(v.id)}">下架</button>`}</div></div>`).join('')}</div></div>`;
 const source=$('#source'),fields=$('#sourcefields'),mode=$('#mode');
 function renderSource(){fields.innerHTML=source.value==='youtube'?`<label for="yt">YouTube 影片網址</label><input id="yt" class="field" placeholder="https://youtu.be/xxxxxxxxxxx"/><label for="ytvis">來源可見度</label><select id="ytvis"><option value="public">公開</option><option value="unlisted">不公開</option></select><div id="riskRow" class="risk-row hidden"><label class="switchrow"><input type="checkbox" id="risk" style="width:auto;min-height:auto"/> 我知道 YouTube 不公開影片的原始網址可以轉傳</label></div>`:`<label>選取 Mux 影片</label><input id="muxfile" type="file" accept="video/*" class="field"/>`;
  if(source.value==='youtube')$('#ytvis').onchange=refreshRisk;refreshRisk();
 }
 function refreshRisk(){const row=$('#riskRow');if(row)row.classList.toggle('hidden',!($('#ytvis').value==='unlisted'&&mode.value!=='public'))}
 source.onchange=renderSource;mode.onchange=()=>{$('#rankfield').style.display=mode.value==='rank'?'block':'none';refreshRisk()};renderSource();
 document.querySelectorAll('[data-publish]').forEach(el=>el.onclick=()=>publishDraft(el.dataset.publish));
 document.querySelectorAll('[data-unpublish]').forEach(el=>el.onclick=()=>unpublishVideo(el.dataset.unpublish));
 document.querySelectorAll('[data-draft-delete]').forEach(el=>el.onclick=()=>deleteDraft(el.dataset.draftDelete));
 document.querySelectorAll('[data-admin-view]').forEach(el=>el.onclick=()=>go('/'+el.dataset.adminView));
 $('#save').onclick=()=>{const title=$('#title').value.trim(),isYT=source.value==='youtube',yt=isYT?$('#yt').value.trim():'';
  if(!title){showToast('請輸入影片標題');return}
  if(isYT&&!validYouTubeUrl(yt)){showToast('請輸入正確的 YouTube 網址');return}
  const unlisted=isYT&&$('#ytvis').value==='unlisted';const risk=unlisted&&mode.value!=='public';
  if(risk&&!$('#risk').checked){showToast('請先確認 YouTube 不公開影片的分享風險');return}
  const v={id:'demo'+Math.random().toString(36).slice(2,10),title,description:$('#desc').value.trim(),category:$('#category').value.trim()||'一般',source:isYT?'YouTube':'Mux',access:mode.value,color:3,youtubeUrl:yt,youtubeVisibility:isYT?$('#ytvis').value:null,acceptRisk:risk?true:false};
  drafts.unshift(v);showToast('已儲存草稿');admin();
 };
}
render();
</script></body></html>
